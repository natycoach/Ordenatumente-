<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EF">
<title>ORDENÁ TU MENTE · NatyCoach</title>
<style>
:root{
  --cream:#FBF6EF; --paper:#FFFCF8; --rose:#EBD0D1; --rose-d:#A0616A;
  --lav:#DDD5EE; --lav-d:#6F5F9E; --sky:#D9E9F2; --sky-d:#4A7A99;
  --gold:#B8935A; --gold-t:#86672E; --gold-l:#E8D6AE;
  --ink:#3A3440; --muted:#766D7E; --line:#E8DCD1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.7;
  background-image:radial-gradient(1200px 500px at 100% -10%,rgba(221,213,238,.35),transparent 60%),radial-gradient(900px 500px at -20% 30%,rgba(235,208,209,.30),transparent 60%);
  background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:var(--sans);cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2;margin:0}
p{margin:0 0 1em}
a{color:var(--lav-d)}

/* barra superior */
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;background:rgba(251,246,239,.92);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#bar.hide{display:none}
#bar .brand{font-size:15px;letter-spacing:.06em;color:var(--gold-t);font-style:italic}
.ibtn{border:0;background:transparent;color:var(--ink);font-size:15px;padding:10px 12px;border-radius:12px;min-height:44px}
.ibtn:active{background:var(--lav)}
#prog{font-family:var(--sans);font-size:14px;color:var(--muted);min-width:64px;text-align:right;padding-right:6px}

#app{max-width:600px;margin:0 auto;padding:0 20px 110px}
.page{padding-top:26px}
.kicker{font-family:var(--sans);font-size:14px;color:var(--gold-t);margin-bottom:6px}
.page h1{font-size:32px;margin-bottom:18px}
.lead{font-size:20px;color:var(--ink)}
.rule{height:1px;border:0;background:linear-gradient(90deg,transparent,var(--gold-l),transparent);margin:30px 0}
.small{font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.55}

/* portada */
.cover{position:relative;min-height:100vh;min-height:100svh;margin:0 -20px;padding:calc(env(safe-area-inset-top,0px) + 34px) 28px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:linear-gradient(172deg,#F2D9DA 0%,#E6DDF1 46%,#D6E7F1 100%)}
.cover svg.orn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .in{position:relative;z-index:2;max-width:430px}
.cover .by{font-style:italic;color:var(--gold-t);letter-spacing:.08em;font-size:17px}
.cover h1{font-size:clamp(38px,11.5vw,56px);letter-spacing:.05em;line-height:1.08;margin:22px 0 18px;color:#3A3046}
.cover .sub{font-style:italic;font-size:19px;line-height:1.55;color:#4B4254;margin:0 auto 26px}
.cover .gl{width:70px;height:1px;background:var(--gold);margin:0 auto 26px}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{font-size:17px;border:0;border-radius:999px;padding:15px 30px;background:var(--lav-d);color:#fff;min-height:50px;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.98)}
.btn.o{background:rgba(255,255,255,.55);color:var(--ink);border:1.5px solid var(--gold)}
.btn.g{background:var(--gold-t)}
.btn.s{font-size:15px;padding:11px 20px;min-height:44px}
.btn.done{background:var(--sky-d)}
.cover .foot{font-family:var(--sans);font-size:13px;color:#5b5163;margin-top:26px}

/* páginas de contenido */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin:22px 0}
.tint-r{background:rgba(235,208,209,.35);border-color:rgba(235,208,209,.9)}
.tint-l{background:rgba(221,213,238,.35);border-color:rgba(221,213,238,.9)}
.tint-s{background:rgba(217,233,242,.45);border-color:rgba(217,233,242,.95)}
.tint-g{background:rgba(232,214,174,.30);border-color:rgba(232,214,174,.8)}
.pull{font-style:italic;font-size:22px;line-height:1.5;text-align:center;padding:26px 6px;margin:26px 0;border-top:1px solid var(--gold-l);border-bottom:1px solid var(--gold-l)}
.pull:before{content:"✦";display:block;color:var(--gold);font-style:normal;font-size:14px;margin-bottom:8px}
.sec{font-size:22px;margin:34px 0 4px}
.how{color:#4b4453}

/* práctica: métodos */
.gest{border-left:4px solid var(--lav);padding:4px 0 4px 16px;margin:22px 0}
.gest h2{font-size:26px;letter-spacing:.03em}
.gest .q{font-style:italic;color:var(--lav-d)}
details.gd{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden}
details.gd summary{list-style:none;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:20px;min-height:56px}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary>span:nth-child(2){flex:1;line-height:1.3}
details.gd summary .small{display:block;margin-top:3px}
details.gd summary:after{content:"+";margin-left:auto;color:var(--gold-t);font-family:var(--sans);font-size:22px}
details.gd[open] summary:after{content:"–"}
details.gd .bd{padding:0 18px 18px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.d-Descargar{background:var(--sky)} .d-Ordenar{background:var(--lav)} .d-Elegir{background:var(--rose)} .d-Soltar{background:var(--gold-l)}
.pill{display:inline-block;font-family:var(--sans);font-size:14px;padding:5px 13px;border-radius:999px;color:var(--ink)}
.p-Descargar{background:var(--sky)} .p-Ordenar{background:var(--lav)} .p-Elegir{background:var(--rose)} .p-Soltar{background:var(--gold-l)}

/* encabezado de día */
.dayh{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.dnum{flex:none;width:82px;height:82px;border-radius:50%;border:1.5px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,252,248,.8)}
.dnum small{font-family:var(--sans);font-size:12px;color:var(--gold-t);line-height:1}
.dnum b{font-weight:400;font-size:38px;line-height:1.05}
.dayh .meta{font-family:var(--sans);font-size:14px;color:var(--muted);margin-bottom:6px}
.dayt{font-size:30px;margin:14px 0 14px}

/* campos */
.fld{margin:24px 0}
.fld>label,.lbl{display:block;font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.4}
.fld.t-rose,.fld.t-lav,.fld.t-sky,.fld.t-gold{padding:14px 16px 10px;border-radius:16px}
.t-rose{background:rgba(235,208,209,.38)} .t-lav{background:rgba(221,213,238,.42)} .t-sky{background:rgba(217,233,242,.55)} .t-gold{background:rgba(232,214,174,.32)}
textarea,input[type=text],input[type=date],select{font-family:var(--serif);font-size:17px;color:var(--ink);width:100%;border:0;outline:0;background:transparent;border-radius:0}
textarea{resize:none;overflow:hidden;line-height:34px;padding:0 2px;background-image:linear-gradient(transparent 33px,#DCCDBF 33px);background-size:100% 34px}
textarea:focus{background-image:linear-gradient(transparent 33px,var(--gold) 33px)}
input[type=text]{border-bottom:1px solid #DCCDBF;padding:6px 2px;min-height:44px}
input[type=text]:focus,input[type=date]:focus{border-bottom-color:var(--gold)}
input[type=date]{border-bottom:1px solid #DCCDBF;padding:8px 2px;min-height:44px}
::placeholder{color:#A99FB0;font-style:italic}
.fill{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:18px 0}
.fill span{font-size:17px}
.fill input{flex:1 1 130px}
.fill.one input{flex-basis:100%}
.lines input{display:block;margin-bottom:2px}

.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.chip{font-family:var(--sans);font-size:15px;line-height:1.3;padding:10px 15px;border-radius:999px;border:1.5px solid var(--lav);background:rgba(255,252,248,.7);color:var(--ink);min-height:44px;text-align:left}
.chip.on{background:var(--lav);border-color:var(--lav-d);font-weight:600}
.chips.frases .chip{border-radius:16px}

.sl{display:flex;align-items:center;gap:10px;margin-top:6px}
.sl input{flex:1;accent-color:var(--gold-t);height:34px}
.sl span{font-family:var(--sans);font-size:12px;color:var(--muted);width:64px;line-height:1.2}
.sl .hi{text-align:right}
input[type=range].un{opacity:.55}
.val{font-family:var(--sans);font-size:13px;color:var(--gold-t);text-align:center}

.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;min-height:48px;font-size:17px;line-height:1.45}
.ck input{flex:none;width:26px;height:26px;margin:2px 0 0;accent-color:var(--gold-t)}
.pair{border-left:3px solid var(--gold-l);padding:0 0 4px 14px;margin:20px 0}
.pair .fld{margin:8px 0}
.perf{margin:20px 0;padding-bottom:6px;border-bottom:1px dashed var(--gold-l)}

/* lista de tareas */
.tl ul{list-style:none;margin:8px 0;padding:0}
.tl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.4}
.tl li input{width:24px;height:24px;accent-color:var(--gold-t);flex:none}
.tl li span{flex:1}
.tl li.dn span{text-decoration:line-through;color:var(--muted)}
.tl li em{font-family:var(--sans);font-size:12px;font-style:normal;background:var(--sky);padding:3px 9px;border-radius:999px}
.tl li button{border:0;background:transparent;font-size:22px;color:var(--muted);min-width:40px;min-height:40px}
.tl .add{display:flex;gap:8px;align-items:center;margin-top:10px}
.tl .add input[type=text]{flex:1}
.tl .add select{width:auto;font-family:var(--sans);font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:var(--paper)}
.tl .add button{border:0;background:var(--lav-d);color:#fff;border-radius:12px;font-size:22px;min-width:46px;min-height:46px}
.tl .empty{font-family:var(--sans);font-size:14px;color:var(--muted)}

/* respiración y timer */
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0;margin:10px 0;border-radius:20px;background:linear-gradient(180deg,rgba(217,233,242,.5),rgba(221,213,238,.45))}
.orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--lav) 70%);border:1px solid var(--gold-l);transform:scale(.7);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1.35);transition-duration:4s}
.orb.out{transform:scale(.7);transition-duration:6s}
.bt{font-size:20px;font-style:italic;min-height:30px;text-align:center;padding:0 12px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:16px;background:rgba(232,214,174,.3);margin:10px 0}
.timer .t{font-family:var(--sans);font-size:32px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer .bs{display:flex;gap:8px}
.note{font-family:var(--sans);font-size:15px;line-height:1.6;padding:14px 16px;border-radius:14px;background:rgba(217,233,242,.55);margin:18px 0}
.note.vis{font-family:var(--serif);font-size:18px;font-style:italic;background:rgba(221,213,238,.45)}

/* acción, cierre, ánimo */
.act{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:20px;background:rgba(235,208,209,.4);margin:16px 0}
.act input{flex:none;width:28px;height:28px;accent-color:var(--gold-t);margin-top:3px}
.act b{font-family:var(--sans);font-size:14px;font-weight:600;display:block;margin-bottom:2px;color:var(--rose-d)}
.closing{text-align:center;font-style:italic;font-size:21px;line-height:1.5;padding:28px 10px 6px}
.closing svg{display:block;margin:0 auto 10px}
.mood{margin-top:28px;padding-top:6px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.mo{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 2px 7px;font-size:24px;line-height:1.2;color:var(--ink)}
.mo small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:2px}
.mo.on{border-color:var(--gold);background:var(--gold-l)}
.dn-row{margin-top:28px;text-align:center}

/* navegación inferior de página */
.pn{display:flex;justify-content:space-between;gap:10px;margin:40px 0 0}
.pn .btn{flex:1;font-size:15px;padding:13px 10px;min-height:48px;background:transparent;color:var(--ink);border:1.5px solid var(--lav)}
.pn .btn.nx{background:var(--lav-d);color:#fff;border-color:var(--lav-d)}

/* semana */
.week{display:flex;gap:6px;align-items:flex-end;margin:14px 0 4px}
.wk{flex:1;text-align:center;font-family:var(--sans);font-size:12px;color:var(--muted)}
.wk .bar{height:90px;background:rgba(221,213,238,.35);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wk .bar i{display:block;width:100%;background:var(--lav-d);opacity:.75;border-radius:6px 6px 0 0}
.wk b{display:block;font-weight:600;color:var(--ink);margin-top:4px}
.wk span{font-size:16px}
.big .wk .bar{height:70px}

/* mapa */
.bar-p{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar-p i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--lav-d))}
.mapa a.dl{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:12px 4px;border-bottom:1px solid var(--line);min-height:54px}
.mapa .nb{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold-l);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:14px}
.mapa .nb.ok{background:var(--gold-l);border-color:var(--gold)}
.mapa .tt{flex:1;line-height:1.3}
.wkh{margin:30px 0 4px}
.wkh h2{font-size:22px}

/* menú lateral */
#menu{position:fixed;inset:0;z-index:40;display:none}
#menu.open{display:block}
#menu .sc{position:absolute;inset:0;background:rgba(58,52,64,.4)}
#menu .pn2{position:absolute;top:0;bottom:0;left:0;width:min(88vw,360px);background:var(--cream);padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);overflow:auto;box-shadow:6px 0 30px rgba(58,52,64,.18)}
#menu h3{font-size:20px;margin:0 0 10px;color:var(--gold-t);font-style:italic}
#menu a.ml{display:block;padding:11px 6px;color:var(--ink);text-decoration:none;font-size:17px;border-bottom:1px solid var(--line)}
#menu .dg{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:14px 0}
#menu .dg a{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--lav);border-radius:50%;font-family:var(--sans);font-size:14px;text-decoration:none;color:var(--ink)}
#menu .dg a.ok{background:var(--gold-l);border-color:var(--gold)}
#menu .dg a.cur{outline:2px solid var(--lav-d);outline-offset:2px}
#menu .rs{margin-top:18px;font-family:var(--sans);font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;padding:8px 0}

.disc{font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);margin-top:34px;padding-top:14px}
.sig{font-style:italic;font-size:22px;color:var(--gold-t);margin-top:18px}
.two{display:grid;gap:12px}
.tool{margin:8px 0 0;padding-left:0;list-style:none}
.tool li{padding:8px 0 8px 0;border-bottom:1px solid var(--line)}
.stp{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.stp li{counter-increment:s;position:relative;padding:8px 0 8px 46px;font-size:17px;line-height:1.55}
.stp li:before{content:counter(s);position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;background:var(--lav);font-family:var(--sans);font-size:14px;display:flex;align-items:center;justify-content:center}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.grid30 label{display:flex;flex-direction:column;align-items:center;font-family:var(--sans);font-size:11px;color:var(--muted);gap:3px}
.grid30 input{width:26px;height:26px;accent-color:var(--gold-t)}
.cmp{margin:16px 0;padding-bottom:6px;border-bottom:1px dashed var(--gold-l)}
.cmp .was{font-family:var(--sans);font-size:14px;color:var(--muted)}

@media (min-width:700px){body{font-size:19px}.cover{border-radius:0 0 30px 30px}}
@media (prefers-reduced-motion:reduce){.orb{transition:none!important}html{scroll-behavior:auto}}
@media print{#bar,#menu,.pn,.dn-row,.btn,.breath,.timer{display:none!important}body{background:#fff}.cover{min-height:auto;page-break-after:always}.card{break-inside:avoid}}
#sosf{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:15;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--rose);border:1.5px solid var(--gold);border-radius:999px;padding:10px 15px;min-height:44px;box-shadow:0 6px 18px rgba(58,52,64,.18)}
</style>
</head>
<body>
<header id="bar" class="hide">
  <button class="ibtn" data-act="menu" aria-label="Abrir el índice">☰ Índice</button>

</header>
<div id="menu" aria-hidden="true"><div class="sc" data-act="close"></div><nav class="pn2" id="menuIn"></nav></div>
<main id="app"></main>
<script>
"use strict";
/* ---------- estado y guardado local ---------- */

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function $(s,r){ return (r||document).querySelector(s); }

function spark(x,y,s,o){ return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#B8935A" opacity="'+(o||.8)+'"/>'; }
function coverArt(){
  return '<svg class="orn" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+

/* ---------- componentes ---------- */
function ta(id,label,ph,rows,tone){
  return '<div class="fld'+(tone?' t-'+tone:'')+'"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" data-k="'+id+'" data-t="ta" rows="'+(rows||3)+'" placeholder="'+esc(ph||"")+'">'+esc(get(id,""))+'</textarea></div>';
}
function lines(id,label,n,ph){
  var h='<div class="fld lines"><label>'+label+'</label>';
  for(var i=0;i<n;i++){ h+='<input type="text" data-k="'+id+'_'+i+'" data-t="tx" placeholder="'+esc(ph||(i+1)+".")+'" value="'+esc(get(id+"_"+i,""))+'" aria-label="'+esc(label)+' '+(i+1)+'">'; }
  return h+'</div>';
}
function chips(id,label,opts,multi,cls){
  var cur=get(id,multi?[]:""), h='<div class="fld">'+(label?'<label>'+label+(multi?'<span class="small" style="font-weight:400"> (podés marcar varias)</span>':'')+'</label>':'')+'<div class="chips '+(cls||"")+'" data-chips="'+id+'" data-multi="'+(multi?1:0)+'">';
  opts.forEach(function(o){ var on=multi?(cur.indexOf(o)>-1):(cur===o); h+='<button type="button" class="chip'+(on?' on':'')+'" data-v="'+esc(o)+'" aria-pressed="'+on+'">'+esc(o)+'</button>'; });
  return h+'</div></div>';
}
function slider(id,label,lo,hi,min,max){
  min=min==null?0:min; max=max==null?10:max; var v=get(id,null);
  return '<div class="fld"><label>'+label+'</label><div class="sl"><span>'+esc(lo||"")+'</span><input type="range" min="'+min+'" max="'+max+'" step="1" data-k="'+id+'" data-t="sl" value="'+(v==null?Math.round((min+max)/2):v)+'" class="'+(v==null?'un':'')+'" aria-label="'+esc(label)+'"><span class="hi">'+esc(hi||"")+'</span></div><div class="val" id="'+id+'_v">'+(v==null?'Deslizá para marcar':v+' / '+max)+'</div></div>';
}
function checks(id,items){
  var h='<div class="fld">';
  items.forEach(function(t,i){ var k=id+'_'+i; h+='<label class="ck"><input type="checkbox" data-k="'+k+'" data-t="ck"'+(get(k,false)?' checked':'')+'><span>'+t+'</span></label>'; });
  return h+'</div>';
}
function fill(id,items){
  var h='';
  items.forEach(function(s,i){
    var parts=s.split("___"), one=parts.length===2&&!parts[1].trim();
    h+='<div class="fill'+(one?' one':'')+'">';
    for(var j=0;j<parts.length;j++){
      if(parts[j].trim()) h+='<span>'+parts[j]+'</span>';
      if(j<parts.length-1){ var k=id+'_'+i+'_'+j; h+='<input type="text" data-k="'+k+'" data-t="tx" value="'+esc(get(k,""))+'" aria-label="'+esc(parts[0].trim()||"completar")+'">'; }
    }
    h+='</div>';
  });
  return h;
}
function pairs(id,n,labels,rows){
  var h='';
  for(var r=0;r<n;r++){
    h+='<div class="pair">';
    labels.forEach(function(l,c){ h+=ta(id+'_'+r+'_'+c,l,'',rows||2); });
    h+='</div>';
  }
  return h;
}
function perf(id,n){
  var h='';
  for(var i=0;i<n;i++){
    h+='<div class="perf"><div class="fld" style="margin:6px 0"><label for="'+id+'_a'+i+'">Un área donde me exijo de más</label><input type="text" id="'+id+'_a'+i+'" data-k="'+id+'_a'+i+'" data-t="tx" value="'+esc(get(id+'_a'+i,""))+'" placeholder="Ej.: la casa, el trabajo, cómo me ven..."></div>'+
      slider(id+'_e'+i,'Lo que me exijo hoy','Poco','Todo',0,10)+slider(id+'_s'+i,'Lo que sería suficiente','Poco','Todo',0,10)+'</div>';
  }
  return h;
}
function taskList(id,label,ph){
  return '<div class="fld tl" data-list="'+id+'"><label>'+label+'</label><ul></ul><div class="add"><input type="text" placeholder="'+esc(ph)+'" aria-label="Nuevo pendiente"><select aria-label="Cuánto lleva"><option>5 min</option><option>30 min</option><option>Grande</option></select><button type="button" data-act="add" aria-label="Agregar">+</button></div></div>';
}
function paintList(el){
  var id=el.getAttribute("data-list"), arr=get(id,[]), ul=$("ul",el), h="";
  if(!arr.length) h='<li class="empty" style="border:0">Todavía no anotaste nada. Escribí abajo y tocá +.</li>';
  arr.forEach(function(it,i){ h+='<li class="'+(it.c?'dn':'')+'"><input type="checkbox" data-act="tog" data-i="'+i+'"'+(it.c?' checked':'')+' aria-label="Hecho"><span>'+esc(it.t)+'</span><em>'+esc(it.d)+'</em><button type="button" data-act="del" data-i="'+i+'" aria-label="Quitar">×</button></li>'; });
  ul.innerHTML=h;
}
function breath(secs){
  return '<div class="breath" data-breath="'+(secs||60)+'"><div class="orb"></div><div class="bt">Inhalá 4 segundos. Exhalá 6.</div><button type="button" class="btn s" data-act="breath">Comenzar ('+(secs||60)+' seg)</button></div>';
}
function timer(min){
  return '<div class="timer" data-timer="'+min*60+'"><div class="t">'+(min<10?'0':'')+min+':00</div><div class="bs"><button type="button" class="btn s" data-act="tgo">Iniciar</button><button type="button" class="btn s o" style="background:transparent" data-act="trs">Reiniciar</button></div></div>';
}
function note(t,vis,links){
  var h='<div class="note'+(vis?' vis':'')+'">'+t;
  if(links){ h+='<div class="stack" style="margin-top:12px;align-items:flex-start">'; links.forEach(function(l){ h+='<a class="btn s" href="#" data-go="'+l[0]+'">'+l[1]+'</a>'; }); h+='</div>'; }
  return h+'</div>';
}
function week(from,to){
  var h='<div class="week">';
  for(var n=from;n<=to;n++){
    var r=get('d'+n+'_ruido',null), m=get('d'+n+'_mood',null);
    h+='<div class="wk"><div class="bar" title="Ruido mental"><i style="height:'+(r==null?0:r*10)+'%"></i></div><b>'+n+'</b><span>'+(m==null?'·':MOODS[m].e)+'</span></div>';
  }
  return h+'</div><p class="small">La altura de cada barra es el ruido mental que registraste ese día. Abajo, cómo te sentiste.</p>';
}
function clearBtn(prefix){ return '<div style="text-align:center;margin:8px 0 4px"><button type="button" class="btn s o" style="background:transparent" data-act="clear" data-p="'+prefix+'">Empezar de nuevo</button></div>'; }

/* render de bloques */
function block(b,pre){
  var id=b.id?pre+b.id:"";
  switch(b.k){
    case "ta": return ta(id,b.l,b.ph,b.rows,b.tone);
    case "lines": return lines(id,b.l,b.n,b.ph);
    case "chips": return chips(id,b.l,b.o,b.multi,b.cls);
    case "slider": return slider(id,b.l,b.lo,b.hi,b.min,b.max);
    case "checks": return checks(id,b.items);
    case "fill": return fill(id,b.items);
    case "pairs": return pairs(id,b.n,b.labels,b.rows);
    case "perf": return perf(id,b.n);
    case "list": return taskList(id,b.l,b.ph);
    case "breath": return breath(b.s);
    case "timer": return timer(b.m);
    case "note": return note(b.t,b.vis,b.links);
    case "week": return week(b.a,b.b);
    case "circle": return circleArt();
  }
  return "";
}

/* ---------- respiración y timer ---------- */
var BR=null, TIM=null;
function fmt(s){ var m=Math.floor(s/60), x=s%60; return (m<10?"0":"")+m+":"+(x<10?"0":"")+x; }
function stopBreath(fin){
  if(!BR) return; clearTimeout(BR.t); clearInterval(BR.tick);
  BR.orb.className="orb"; BR.bt.textContent=fin?"Listo. Notá cómo estás ahora.":"Inhalá 4 segundos. Exhalá 6."; BR.btn.textContent=BR.orig; BR=null;
}
function breathToggle(box){
  if(BR&&BR.box===box){ stopBreath(false); return; }
  stopBreath(false);
  var orb=$(".orb",box), bt=$(".bt",box), btn=$("[data-act=breath]",box), left=+box.getAttribute("data-breath");
  BR={box:box,orb:orb,bt:bt,btn:btn,orig:btn.textContent,t:null,tick:null};
  btn.textContent="Detener ("+left+")";
  function inh(){ orb.className="orb in"; bt.textContent="Inhalá…"; BR.t=setTimeout(exh,4000); }
  function exh(){ orb.className="orb out"; bt.textContent="Exhalá despacio…"; BR.t=setTimeout(inh,6000); }
  BR.tick=setInterval(function(){ left--; if(left<=0){ stopBreath(true); } else { btn.textContent="Detener ("+left+")"; } },1000);
  setTimeout(inh,30);
}
function stopTimer(){ if(TIM){ clearInterval(TIM.iv); TIM=null; } }
function timerGo(box){
  var tEl=$(".t",box), btn=$("[data-act=tgo]",box);
  if(TIM&&TIM.box===box){ if(TIM.run){ clearInterval(TIM.iv); TIM.run=false; btn.textContent="Seguir"; return; } }
  else { stopTimer(); TIM={box:box,left:+box.getAttribute("data-timer"),run:false,iv:null}; }
  TIM.run=true; btn.textContent="Pausar";
  TIM.iv=setInterval(function(){
    TIM.left--; tEl.textContent=fmt(TIM.left);
    if(TIM.left<=0){ clearInterval(TIM.iv); TIM=null; tEl.textContent="¡Tiempo!"; btn.textContent="Iniciar"; try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} }
  },1000);
}
function timerReset(box){ if(TIM&&TIM.box===box) stopTimer(); $(".t",box).textContent=fmt(+box.getAttribute("data-timer")); $("[data-act=tgo]",box).textContent="Iniciar"; }
function stopAll(){ stopBreath(false); stopTimer(); }

function pad2(n){ return (n<10?"0":"")+n; }
function backupObj(){ return {app:"ordena-tu-mente",marca:"NatyCoach",exportado:new Date().toISOString(),datos:S}; }
function doBackup(){
  try{
    var blob=new Blob([JSON.stringify(backupObj())],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var d=new Date(), name="copia-ordena-tu-mente-"+d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+".json";
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },5000);
  }catch(e){ window.alert("No se pudo crear la copia en este navegador."); }
}
function doRestore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result), d=(obj&&obj.datos)?obj.datos:obj;
      if(!d||typeof d!=="object") throw 0;
      if(!window.confirm("Esto va a reemplazar lo que tenés guardado ahora por lo que hay en la copia. ¿Continuar?")) return;
      S=d; flushSave();
      window.alert("Copia restaurada."); location.reload();
    }catch(e){ window.alert("Ese archivo no parece una copia válida de este cuaderno."); }
  };
  r.readAsText(file);
}

  else if(act==="add") addItem(a.closest("[data-list]"));
  else if(act==="del"||act==="tog"){ var lb=a.closest("[data-list]"), id2=lb.getAttribute("data-list"), arr=get(id2,[]).slice(), ix=+a.getAttribute("data-i"); if(act==="del") arr.splice(ix,1); else arr[ix].c=!arr[ix].c; set(id2,arr); paintList(lb); }
  else if(act==="breath") breathToggle(a.closest("[data-breath]"));
  else if(act==="tgo") timerGo(a.closest("[data-timer]"));
  else if(act==="trs") timerReset(a.closest("[data-timer]"));
  else if(act==="mood"){ var d=a.getAttribute("data-d"), val=+a.getAttribute("data-v"); set("d"+d+"_mood",val); $$(".mo").forEach(function(m){ m.classList.toggle("on",m===a); }); }
  else if(act==="done"){ var dd=a.getAttribute("data-d"), nv2=!get("done"+dd,false); set("done"+dd,nv2); a.classList.toggle("done",nv2); a.textContent=nv2?"✓ Día completado":"Completé el día"; updateBar(); }
  else if(act==="clear"){ var p=a.getAttribute("data-p"); Object.keys(S).forEach(function(k){ if(k.indexOf(p)===0) delete S[k]; }); save(); stopAll(); render(); }
  else if(act==="back"){ go(LAST&&LAST!=="sos"?LAST:"mapa"); }
  else if(act==="backup"){ doBackup(); }
  else if(act==="restore-btn"){
    var inp=document.getElementById("restoreInput");
    if(!inp){ inp=document.createElement("input"); inp.type="file"; inp.accept="application/json"; inp.id="restoreInput"; inp.style.display="none";
      inp.addEventListener("change",function(){ if(inp.files&&inp.files[0]) doRestore(inp.files[0]); inp.value=""; });
      document.body.appendChild(inp);
    }
    inp.click();
  }
  else if(act==="reset"){
    if(!a.getAttribute("data-c")){ a.setAttribute("data-c","1"); a.textContent="Tocá de nuevo para confirmar el borrado"; a.style.color="#A0616A"; }
    else { S={}; try{ localStorage.removeItem(KEY); }catch(er){} go("portada"); }
  }
});
